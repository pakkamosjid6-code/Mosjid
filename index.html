function pubSkel(){return'<div id="pinfo"></div><div class="fm"><b>মসজিদ খুঁজুন</b><input id="ps" placeholder="মসজিদের নাম লিখুন" value="'+esc(PSQ)+'" oninput="PSQ=this.value;updPub()"><div id="pchips"></div></div>'}
function updPub(){
  var ps=document.getElementById("pstrip");if(ps)ps.innerHTML=stripHtml();
  var i=document.getElementById("pinfo"),c=document.getElementById("pchips");
  if(!i||!c)return;
  var h='';
  if(!PT)h='<div class="hero"><div class="hj">সময় লোড হচ্ছে…</div></div>';
  else if(PT.err)h='<div class="hero"><div class="hj">সময় আনা যায়নি, ইন্টারনেট দেখে আবার চেষ্টা করুন।</div></div>';
  else{
    var hj=PT.date.hijri,nx=nextWaqt();
    h+='<div class="hero"><div class="dt">'+PT.date.readable+'</div><div class="hj">'+hj.day+' '+hj.month.en+' '+hj.year+' হিজরি</div>'+(nx?'<div class="nx">পরের ওয়াক্ত: <b>'+nx.n+'</b> · '+nx.t+'</div>':'')+'</div>';
    var nm=PSEL&&MS.find(function(x){return x.id===PSEL});
    var K=[["Fajr","ফজর","fajr"],["Dhuhr","যোহর","dhuhr"],["Asr","আসর","asr"],["Maghrib","মাগরিব","maghrib"],["Isha","এশা","isha"]];
    h+='<div class="wt"><div class="wh"><span>ওয়াক্ত</span><span>আজান</span><span>জামাত</span></div>'+K.map(function(k){return'<div class="wr"><span>'+k[1]+'</span><span>'+PT.timings[k[0]].slice(0,5)+'</span><span class="jm">'+(TJ&&TJ[k[2]]?fmtT(TJ[k[2]]):'—')+'</span></div>'}).join("")+'</div>';
    h+=(nm?'<div class="sel"><b>'+esc(nm.name)+'</b> — জামাতের সময়</div>':'<div class="sel mu">নিচে থেকে মসজিদ বাছলে তার জামাতের সময় দেখাবে</div>');
  }
  i.innerHTML=h;
  var q=PSQ.trim();
  var list=MS.filter(function(x){return !q||x.name.indexOf(q)>-1});
  list=q?list.slice(0,12):list.slice(0,6);
  c.innerHTML=list.length?'<div class="chips">'+list.map(function(x){return'<button class="'+(x.id===PSEL?"on":"")+'" onclick="pubPick(\''+x.id+'\')">'+esc(x.name)+'</button>'}).join("")+'</div>'+(!q&&MS.length>6?'<p class="mu sm">আরও মসজিদ খুঁজতে নাম লিখুন</p>':''):'<p class="mu sm">এই নামে কোনো মসজিদ পাওয়া যায়নি।</p>';
}
function nextWaqt(){
  if(!PT||PT.err)return null;
  var K=[["Fajr","ফজর"],["Dhuhr","যোহর"],["Asr","আসর"],["Maghrib","মাগরিব"],["Isha","এশা"]];
  var d=new Date(),now=d.getHours()*60+d.getMinutes();
  for(var i=0;i<K.length;i++){var t=PT.timings[K[i][0]].slice(0,5),mins=(+t.slice(0,2))*60+(+t.slice(3,5));if(mins>now)return{n:K[i][1],t:t}}
  return{n:"ফজর",t:PT.timings.Fajr.slice(0,5)+" (আগামীকাল)"};
}
var LOGINOPEN=false,PEND=null;try{LOGINOPEN=sessionStorage.getItem("lg")==="1";sessionStorage.removeItem("lg")}catch(e){}
function stripHtml(){if(!PT||PT.err)return"";var hj=PT.date.hijri,nx=nextWaqt();return'<div class="hero"><div class="dt">'+PT.date.readable+' · '+hj.day+' '+hj.month.en+' '+hj.year+' হিজরি</div>'+(nx?'<div class="nx">পরের ওয়াক্ত: <b>'+nx.n+'</b> · '+nx.t+'</div>':'')+'</div>'}
function mpick(){return'<label style="margin-bottom:14px">মসজিদ বেছে নিন<select id="mp" onchange="sw(this.value)"><option value="">— মসজিদ বেছে নিন —</option>'+opts()+'</select></label>'}
function anonHome(){
  var h='';
  if(m===null)h+='<p class="mu">মসজিদ বেছে নিলে তার আয়-ব্যয়ের হিসাব ও দানের নম্বর এখানে দেখা যাবে।</p>';
  else h+='<h3 style="margin:6px 0 8px">'+esc(mname(m))+' · আয়-ব্যয়ের হিসাব</h3>'+ledger("acc")+'<h3 style="margin:14px 0 8px">💝 এই মসজিদে দান করুন</h3>'+donate();
  h+='<div class="gr" style="grid-template-columns:repeat(2,1fr);margin-top:12px"><button class="gt" onclick="go(\'pm\')"><span>👥</span>সদস্যবৃন্দ</button><button class="gt" onclick="go(\'tm\')"><span>🕌</span>জামাতের সময়</button><button class="gt" onclick="go(\'bl\')"><span>🩸</span>রক্তদাতা</button><button class="gt" onclick="go(\'hp\')"><span>🤝</span>এলাকার সহায়তা</button></div>';
  return h+'<p style="text-align:center;margin-top:24px"><button class="x" onclick="lockTap()">মসজিদের কর্মকর্তা? লগইন করুন</button></p>';
}
function anonBody(){
  var h=mpick();
  if(tab==="home")return h+anonHome();
  if(tab==="tm")return h+pubSkel();
  if(tab==="pm")return h+pubMembers();
  if(m===null)return h+'<p class="mu">উপরের তালিকা থেকে মসজিদ বেছে নিন।</p>';
  return h+(tab==="don"?donate():tab==="bl"?blood():ledger(tab==="hp"?"hp":"acc"));
}
var PM={};
function loadPM(i){db.rpc("public_members",{mid:i}).then(function(r){PM[i]=r||[];render()}).catch(function(){PM[i]=null;render()})}
function pubMembers(){
  var l=PM[m];
  if(m===null)return'<p class="mu">উপরের তালিকা থেকে একটি মসজিদ বেছে নিন।</p>';
  if(l===undefined)return'<p class="mu">লোড হচ্ছে…</p>';
  if(!l||!l.length)return'<p class="mu">এই মসজিদের সদস্য তালিকা এখনো যোগ হয়নি।</p>';
  var h='<p class="mu" style="margin-bottom:6px">মোট '+bn(l.length)+' জন · ফোন নম্বর ও ঠিকানা এখানে দেখানো হয় না।</p>';
  l.slice().sort(function(a,b){return rOrd(a.r)-rOrd(b.r)||((a.n||"")<(b.n||"")?-1:1)}).forEach(function(r){h+='<div class="row"><div>'+esc(r.n||"")+'<small>'+esc(r.r||"")+(r.rs?" · "+esc(r.rs):"")+'</small></div></div>'});
  return h;
}
function pubOpen(k){PEND=k;if(db&&user){PEND=null;go(k);return}anonIn()}
function lockTap(){if(ANON){try{sessionStorage.setItem("lg","1")}catch(e){}signOut();return}LOGINOPEN=true;authView()}
function toggleLogin(){LOGINOPEN=!LOGINOPEN;if(LOGINOPEN)authView();else start()}

function pubPick(id){PSEL=id;TJ=null;if(TJU)TJU();TJU=DB.doc("jt/"+id).onSnapshot(function(s){TJ=s.exists?s.data():{};updPub()},function(){});updPub()}
function authView(note){
  if(!PUBL){PUBL=true;loadPT();loadMS()}
  var lg=LOGINOPEN?loginHtml(note):"";
  document.getElementById("app").innerHTML='<header><h2>মসজিদ হিসাব ও সেবা</h2>'+(LOGINOPEN?'<button class="hb" onclick="toggleLogin()">বন্ধ</button>':'')+'</header><main class="cmp">'+(LOGINOPEN?lg:'<p class="mu">লোড হচ্ছে…</p>')+'</main>';
  updPub();
}

function editJT(){
  var v2=TJM||{};
  return'<div class="fm"><b>আমাদের মসজিদের জামাতের সময়</b><p class="mu" style="font-size:13px;margin:0">এখানে লেখা সময় সবাই দেখবে।</p>'+[["jf","ফজর","fajr"],["jz","যোহর","dhuhr"],["ja","আসর","asr"],["jm","মাগরিব","maghrib"],["je","এশা","isha"]].map(function(x){return'<label>'+x[1]+'<input id="'+x[0]+'" type="time" value="'+esc(v2[x[2]]||"")+'"></label>'}).join("")+'<button class="b" onclick="saveJT()">জামাতের সময় সংরক্ষণ করুন</button><p class="er">'+msg+'</p></div>';
}
function saveJT(){db.doc("jt/"+m).set({fajr:g("jf"),dhuhr:g("jz"),asr:g("ja"),maghrib:g("jm"),isha:g("je"),by:uid,ts:Date.now()}).then(function(){msg="জামাতের সময় সংরক্ষিত হয়েছে";render()}).catch(fail)}
function watchJM(){if(TJMU)TJMU();TJMU=db.doc("jt/"+m).onSnapshot(function(s){TJM=s.exists?s.data():{};render()},function(){})}
function go(t){tab=t;msg="";if(ANON&&m!==null)loadTot(m);if(ANON&&t==="pm"&&m!==null&&PM[m]===undefined)loadPM(m);if(t==="tm"){loadPT();if(canW&&m!==null)watchJM();if(m!==null&&PSEL!==m)pubPick(m)}render()}
function sw(i){if(i==="")return;pick(i);if(tab==="tm"){if(canW)watchJM();pubPick(i)}render()}


function fmtT(t){
  if(!t)return"—";
  var mt=/^(\d{1,2}):(\d{2})$/.exec(t);
  if(!mt)return esc(t);
  var hh=+mt[1],mm=mt[2],p;
  if(hh<4)p="রাত";else if(hh<6)p="ভোর";else if(hh<12)p="সকাল";else if(hh<16)p="দুপুর";else if(hh<18)p="বিকাল";else if(hh<20)p="সন্ধ্যা";else p="রাত";
  return p+" "+(hh%12||12)+":"+mm;
}
var MQ="",RL=["সভাপতি","সহ-সভাপতি","সেক্রেটারি","কোষাধ্যক্ষ","ইমাম","মুয়াজ্জিন","খাদেম","কমিটি সদস্য","সাধারণ সদস্য"];
var TT={acc:"হিসাব",don:"দানের নম্বর",bl:"রক্তদাতা",hp:"এলাকার সহায়তা",tm:"জামায়াত",mb:"সদস্যবৃন্দ",pd:"পদবি ও দায়িত্ব",rq:"অনুরোধ",nm:"নতুন মসজিদ"};
var SOON=[["notice","📢","নোটিশ"],["event","📅","ইভেন্ট"],["att","✅","উপস্থিতি"],["maktab","🎓","মক্তব"],["khutba","🎙️","জুমার খুতবা"],["report","📊","রিপোর্ট"],["chanda","💵","মাসিক চাঁদা"],["pay","🛡️","পেমেন্ট অনুমোদন"],["paysetup","👛","পেমেন্ট সেটআপ"],["myacc","🏦","আমার হিসাব"],["donate","💝","অনলাইন দান"],["fund","💲","তহবিল সংগ্রহ"],["tree","🌳","পারিবারিক গাছ"]];
var SOONT={};SOON.forEach(function(x){SOONT[x[0]]=x[2];TT[x[0]]=x[2]});
function navHtml(tb){
  if(ANON)return'<nav>'+tb.map(function(x){return'<button class="'+(x[0]===tab?"on":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</nav>';
  if(tab==="home")return"";
  return'<div class="bk"><button onclick="go(\'home\')">← হোম</button><b>'+esc(TT[tab]||"")+'</b></div>';
}
function tile(k,ic,nm,soon,extra){return'<button class="gt'+(soon?" s":"")+'" onclick="go(\''+k+'\')"><span>'+ic+'</span>'+nm+(soon?'<small>শীঘ্রই</small>':"")+(extra||"")+'</button>'}
function homeView(){
  var h=m===null?'<p class="mu" style="margin-bottom:10px">উপরের তালিকা থেকে একটি মসজিদ বেছে নিন।</p>':'';
  h+='<div class="gr">'+tile("acc","💰","হিসাব")+tile("don","💝","দানের নম্বর")+tile("bl","🩸","রক্তদাতা")+tile("hp","🤝","এলাকার সহায়তা")+tile("tm","🕌","জামায়াত")+tile("mb","👥","সদস্যবৃন্দ")+tile("pd","🏅","পদবি ও দায়িত্ব");
  SOON.forEach(function(x){h+=tile(x[0],x[1],x[2],true)});
  if(admin)h+=tile("rq","📨","অনুরোধ"+(reqs.length?" ("+bn(reqs.length)+")":""))+tile("nm","➕","নতুন মসজিদ");
  return h+'</div>';
}
function soonView(){return'<div class="fm"><b>'+esc(SOONT[tab])+'</b><p class="mu" style="margin:0">এই ফিচারটি শীঘ্রই যোগ হবে।</p></div>'}
function addMb(){
  var n=g("mn");if(!n)return;
  db.collection("mb").add({m:m,n:n,p:g("mp"),ad:g("mad"),r:g("mr"),rs:g("ms"),ts:Date.now(),by:uid}).catch(fail);
  ["mn","mp","mad","ms"].forEach(function(i){document.getElementById(i).value=""});
}
function rOrd(r){var i=RL.indexOf(r);return i<0?99:i}
function membersView(){
  var h=(msg?'<p class="er">'+msg+'</p>':"");
  if(canW)h+='<div class="fm"><b>নতুন সদস্য</b><label>নাম<input id="mn"></label><label>মোবাইল নম্বর<input id="mp" type="tel" inputmode="tel"></label><label>ঠিকানা<input id="mad"></label><label>পদবি<select id="mr">'+RL.slice().reverse().map(function(x){return"<option"+(x==="সাধারণ সদস্য"?" selected":"")+">"+x+"</option>"}).join("")+'</select></label><label>দায়িত্ব (ঐচ্ছিক)<input id="ms"></label><button class="b" onclick="addMb()">সদস্য যোগ করুন</button></div>';
  h+='<label style="margin-bottom:10px">নাম বা নম্বর দিয়ে খুঁজুন<input id="mq" value="'+esc(MQ)+'" oninput="MQ=this.value;render()"></label>';
  var L=(rows.mb||[]).filter(function(r){return!MQ||nz(r.n+" "+(r.p||"")).indexOf(nz(MQ))>-1}).sort(function(a,b){return rOrd(a.r)-rOrd(b.r)||(a.n<b.n?-1:1)});
  if(!L.length)return h+'<p class="mu">কোনো সদস্য নেই।</p>';
  h+='<p class="mu" style="margin-bottom:6px">মোট '+bn(L.length)+' জন</p>';
  L.forEach(function(r){h+='<div class="row"><div>'+esc(r.n)+'<small>'+esc(r.r||"")+(r.rs?" · "+esc(r.rs):"")+'</small>'+(r.p?'<small><a href="tel:'+esc(r.p)+'">'+esc(r.p)+'</a></small>':"")+(r.ad?'<small>'+esc(r.ad)+'</small>':"")+'</div>'+(canW?'<button class="x" onclick="del(\'mb\',\''+r.id+'\')">মুছুন</button>':"")+'</div>'});
  return h;
}
function rolesView(){
  var L=(rows.mb||[]).filter(function(r){return r.r&&r.r!=="সাধারণ সদস্য"}),h="";
  if(!L.length)return'<p class="mu">এখনো কারও পদবি দেওয়া হয়নি। "সদস্যবৃন্দ" থেকে সদস্য যোগের সময় পদবি বেছে নিন।</p>';
  RL.forEach(function(role){
    var X=L.filter(function(r){return r.r===role});if(!X.length)return;
    h+='<div class="rl">'+role+'</div>';
    X.forEach(function(r){h+='<div class="row"><div>'+esc(r.n)+(r.rs?'<small>'+esc(r.rs)+'</small>':"")+'</div></div>'});
  });
  return h;
}
start();
</script>
