html,body{margin:0}

.row small{color:var(--mu);display:block}
.in{color:var(--pr);font-weight:700}.out{color:var(--rd);font-weight:700}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:999px;padding:3px 12px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--rd);border-color:var(--rd);color:var(--sf)}
.bg{background:var(--rd2);color:var(--rd);font-weight:700;border-radius:8px;padding:2px 10px;min-width:48px;text-align:center}
a{color:var(--pr)}
.note{font-size:13px;color:var(--mu);margin-top:20px}
header select{background:var(--pr);color:var(--onpr);border-color:currentColor;font-weight:700}
header select option{color:#14302B}
.tb{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--ln);margin-bottom:12px;font-size:14px}
.tb th,.tb td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--ln);line-height:1.4}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb th{color:var(--mu);font-weight:500}
.pc button.on{background:var(--pr);border-color:var(--pr);color:var(--onpr)}
.pt{display:none}
@media print{header,nav,.fm,.chips,.noprint,.x,body::before{display:none!important}.pt{display:block}.row{break-inside:avoid}html:root:root{--bg:#fff;--sf:#fff;--ink:#000;--mu:#444;--pr:#0E5A50;--rd:#B3261E;--ln:#999}body{background:#fff;color:#000}}

<script>

  return '<div class="fm"><b>নতুন মসজিদ যোগ করুন</b><p class="mu" style="margin:0;font-size:13px">তালিকায় না থাকলে এখানে মসজিদের পুরো নাম লিখে যোগ করুন। যোগ হলে সবাই তালিকায় দেখতে পাবেন।</p><label>মসজিদের নাম<input id="amn" placeholder="মসজিদের পুরো নাম"></label><button class="b" onclick="addM()">মসজিদ যোগ করুন</button><p class="er">'+msg+'</p></div>';
}
function addM(){
  var nn=g("amn");
  if(!nn){msg="মসজিদের নাম লিখুন";render();return}
  var ex=MS.find(function(x){return x.name.trim().toLowerCase()===nn.toLowerCase()});
  if(ex){msg="এই নামের মসজিদ আগে থেকেই আছে";render();return}
  var nid=crypto.randomUUID();
  db.doc("mosques/"+nid).set({name:nn,by:uid,ts:Date.now()}).then(function(){msg="মসজিদ যোগ হয়েছে";render()}).catch(fail);
}


var ANON=false,TOT={};
function anonIn(){sb.auth.signInAnonymously().then(function(r){if(r.error)return authView("ব্যর্থ হয়েছে: "+r.error.message);start()})}
function loadTot(i){db.rpc("public_totals",{mid:i}).then(function(r){TOT=r||{};render()}).catch(function(){})}
function phoneOf(id){var x=(rows.bp||[]).find(function(y){return y.id===id});return x?x.p:""}
function anonLedger(k){
  var l=L[k],T=TOT[k]||{};
  var h='<table class="tb"><tr><th></th><th>'+l[0]+'</th><th>'+l[1]+'</th><th>ফলাফল</th></tr>';
  ["day","mo","yr","all"].forEach(function(p){var t=T[p]||{in:0,out:0};h+='<tr><td>'+PL[p]+'</td><td class="in">৳'+bn(t.in)+'</td><td class="out">৳'+bn(t.out)+'</td><td>'+bal(t.in-t.out,k)+'</td></tr>'});
  h+='</table><p class="mu" style="font-size:13px">বিস্তারিত হিসাব শুধু মসজিদের কর্মকর্তারা দেখতে পারেন।</p>';
  if(k==="hp")h+=donate();
  return h;
}
function go(t){tab=t;msg="";if(ANON&&m!==null)loadTot(m);render()}
function pick(i){
  if(i===m)return;
  subs.forEach(function(u){u()});subs=[];m=i;rows={acc:[],bl:[],hp:[],bp:[]};TOT={};
  var ks=ANON?["bl"]:["acc","bl","hp"];
  ks.forEach(function(k){
    subs.push(db.collection(k).where("m","==",i).onSnapshot(function(s){
      rows[k]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return(b.ts||0)-(a.ts||0)});render();
    },function(){}));
  });
  if(!ANON)subs.push(db.collection("bp").where("m","==",i).onSnapshot(function(s){rows.bp=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},function(){}));
  st=null;subs.push(db.doc("settings/m"+i).onSnapshot(function(s){st=s.exists?s.data():null;render()},function(){}));
  if(ANON)loadTot(i);
  if(admin&&tab==="rq")tab="acc";
}
function addDonor(){
  var n=v("n");if(!n)return;
  var id=crypto.randomUUID(),p=v("p");
  db.doc("bl/"+id).set({m:m,n:n,g:v("g"),ld:v("ld"),ts:Date.now(),by:uid}).then(function(){return db.doc("bp/"+id).set({m:m,p:p})}).catch(fail);
  document.getElementById("n").value="";document.getElementById("p").value="";document.getElementById("ld").value="";
}
function del(k,id){db.doc(k+"/"+id).delete().then(function(){if(k==="bl")return db.doc("bp/"+id).delete()}).catch(fail)}
function blood(){
  var h="";
  if(canW)h+='<div class="fm"><label>নাম<input id="n"></label><label>রক্তের গ্রুপ<select id="g">'+G.map(function(x){return"<option>"+x+"</option>"}).join("")+'</select></label><label>মোবাইল নম্বর<input id="p" type="tel" inputmode="tel"></label><label>সর্বশেষ কবে রক্ত দিয়েছেন<input id="ld" type="date"></label><p class="mu" style="font-size:13px">এখনো রক্ত না দিয়ে থাকলে বা তারিখ না জানলে ফাঁকা রাখুন।</p><button class="b" onclick="addDonor()">রক্তদাতা যোগ করুন</button></div>';
  h+='<label style="margin-bottom:12px">নাম'+(canW?' বা নম্বর':'')+' দিয়ে খুঁজুন<input id="q" value="'+esc(q)+'" oninput="q=this.value;render()"></label>';
  h+='<div class="chips">'+["সব"].concat(G).map(function(x){return'<button class="'+(x===grp?"on":"")+'" onclick="setG(\''+x+'\')">'+x+'</button>'}).join("")+'</div>';
  var list=rows.bl.filter(function(r){return(grp==="সব"||r.g===grp)&&(!q||(r.n+" "+(canW?phoneOf(r.id):"")).indexOf(q)>-1)}).sort(function(a,b){var x=a.ld||"",y=b.ld||"";return x<y?-1:x>y?1:0});
  if(!list.length)return h+'<p class="mu">এই খোঁজে কোনো রক্তদাতা পাওয়া যায়নি।</p>';
  h+='<p class="mu" style="margin-bottom:6px">'+bn(list.length)+' জন · যিনি সবচেয়ে আগে রক্ত দিয়েছেন (বা এখনো দেননি) তিনি উপরে</p>';
  list.forEach(function(r){
    var last=r.ld?"শেষ রক্তদান: "+bn(r.ld.split("-").reverse().join("/"))+" ("+ago(r.ld)+")":"এখনো রক্ত দেননি বা তারিখ জানা নেই";
    var ph=canW?phoneOf(r.id):"";
    h+='<div class="row"><div>'+esc(r.n)+(canW?'<small>'+(ph?'<a href="tel:'+esc(ph)+'">'+esc(ph)+'</a>':"নম্বর নেই")+'</small>':'')+'<small>'+last+'</small></div><div style="text-align:right"><span class="bg">'+esc(r.g)+'</span>'+(canW?'<br><button class="x" onclick="gave(\''+r.id+'\')">আজ রক্ত দিয়েছেন</button><br><button class="x" onclick="del(\'bl\',\''+r.id+'\')">মুছুন</button>':"")+'</div></div>';
  });
  return h;
}
async function boot(){
  render();
  try{user=await claude.use("user");db=await claude.use("db")}catch(e){}
  ready=true;
  if(!db||!user){render();return}
  uid=await user.id();admin=await user.canEdit();
  canW=!ANON&&(await user.can("data.write"))!==false;
  db.collection("mosques").onSnapshot(function(s){
    MS=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return a.name<b.name?-1:1});render();
  },function(){});
  if(admin){
    db.collection("requests").onSnapshot(function(s){reqs=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},function(){});
    tab="rq";
  }else if(!ANON){
    db.doc("requests/"+uid).onSnapshot(function(s){myreq=s.exists?s.data():null;render()},function(){});
    db.doc("officers/"+uid).onSnapshot(function(s){off=s.exists?s.data():null;if(off)pick(off.m);render()},function(){});
  }
  render();
}
function render(){
  var keep={},ae=document.activeElement?document.activeElement.id:"";
  document.querySelectorAll("#app input,#app select").forEach(function(e){if(e.id&&e.id!=="sw"&&e.id!=="t")keep[e.id]=e.value});
  var tb=[["acc","হিসাব"],["bl","রক্তদাতা"],["hp","এলাকার সহায়তা"]];
  if(admin)tb.push(["rq","অনুরোধ"+(reqs.length?" ("+bn(reqs.length)+")":"")]);
  var show=db&&user&&(admin||off||ANON);
  if(show)tb.push(["tm","সময়সূচি"]);
  if(show&&!ANON)tb.push(["nm","নতুন মসজিদ"]);
  var h='<header><img src="icon-192.png" alt="" style="width:34px;height:34px;border-radius:50%;background:#fff;flex:0 0 34px">'+((admin||ANON)?'<select id="sw" onchange="sw(this.value)" aria-label="মসজিদ বেছে নিন"><option value="">মসজিদ বেছে নিন</option>'+opts()+'</select>':'<h2>'+(off&&m!==null?esc(mname(m)):"এলাকার মসজিদ ব্যবস্থাপনা")+'</h2>')+'<button onclick="signOut()">বের হন</button></header>';
  if(show)h+='<nav>'+tb.map(function(x){return'<button class="'+(x[0]===tab?"on":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</nav>';
  h+='<main>'+body()+'</main>';
  document.getElementById("app").innerHTML=h;
  for(var id in keep){var el=document.getElementById(id);if(el)el.value=keep[id]}
  if(tab==="tm")updPub();
  if(ae){var f=document.getElementById(ae);if(f&&f.focus)f.focus()}
}
function body(){
  if(!ready)return'<p class="mu">লোড হচ্ছে…</p>';
  if(!db||!user)return'<div class="login"><h1>সাইন ইন প্রয়োজন</h1><p class="mu">এই অ্যাপ ব্যবহার করতে লগইন করুন।</p></div>';
  if(tab==="tm")return pubSkel()+(canW&&m!==null?editJT():"");
  if(ANON){
    if(m===null)return'<p class="mu">উপরের তালিকা থেকে একটি মসজিদ বেছে নিন।</p>';
    return tab==="bl"?blood():ledger(tab==="hp"?"hp":"acc");
  }
  if(!admin&&!off){
    if(myreq)return'<div class="login"><h1>অনুরোধ পাঠানো হয়েছে</h1><p class="mu">'+esc(mname(myreq.m))+' — আপনার অনুরোধ অনুমোদনের অপেক্ষায় আছে। অনুমোদন হলে এই পেজ নিজে থেকেই খুলে যাবে।</p></div>';
    return'<div class="login"><h1>মসজিদের অ্যাকাউন্টের অনুরোধ</h1><p class="mu">আপনার মসজিদ বেছে নিন। তালিকায় না থাকলে নতুন মসজিদ যোগ করুন। এলাকার প্রধান অনুমোদন দিলে আপনি প্রবেশ করতে পারবেন।</p>'+reqForm()+'<button class="b" onclick="ask()">অনুরোধ পাঠান</button><p class="er">'+msg+'</p></div>';
  }
  if(tab==="nm")return addMosque();
  if(tab==="rq")return reqView();
  if(m===null)return'<p class="mu">উপরের তালিকা থেকে একটি মসজিদ বেছে নিন।</p>';
  return(msg?'<p class="er">'+msg+'</p>':"")+(canW?"":'<p class="mu">আপনি শুধু দেখতে পারবেন, তথ্য বদলাতে পারবেন না।</p>')+(tab==="acc"?ledger("acc"):tab==="bl"?blood():ledger("hp"));
}


var PT=null,PTL=false,PUBL=false,PSQ="",PSEL="",TJ=null,TJU=null,TJM=null,TJMU=null;
var LOGIN_HTML='<div class="login"><h1>লগইন</h1><label>ইমেইল<input id="em" type="email"></label><label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)<input id="pw" type="password"></label><button class="b" onclick="doAuth(false)">লগইন</button><button class="x" onclick="doAuth(true)">নতুন অ্যাকাউন্ট খুলুন</button><button class="x" onclick="anonIn()">লগইন ছাড়া শুধু দেখুন</button><p class="er">'+"'"+'+(note||"")+'+"'"+'</p></div>';
function loadPT(){
  if(PT||PTL)return;PTL=true;
  var d=new Date(),ds=String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear();
  fetch("https://api.aladhan.com/v1/timings/"+ds+"?latitude=22.61&longitude=91.68&method=1").then(function(r){return r.json()}).then(function(j){PT=j.data;PTL=false;updPub()}).catch(function(){PT={err:1};PTL=false;updPub()});
}
function loadMS(){DB.collection("mosques").get().then(function(r){MS=r.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return a.name<b.name?-1:1});updPub()}).catch(function(){})}
function pubSkel(){return'<div id="pinfo"></div><div class="fm"><b>মসজিদ খুঁজুন</b><input id="ps" placeholder="মসজিদের নাম লিখুন" value="'+esc(PSQ)+'" oninput="PSQ=this.value;updPub()"><div id="pchips"></div></div>'}
function updPub(){
  var i=document.getElementById("pinfo"),c=document.getElementById("pchips");
  if(!i||!c)return;
  var h='<div class="fm"><b>আজকের তারিখ ও নামাজের ওয়াক্ত</b>';
  if(!PT)h+='<p class="mu" style="margin:0">সময় লোড হচ্ছে…</p>';
  else if(PT.err)h+='<p class="mu" style="margin:0">সময় আনা যায়নি, ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>';
  else{
    var hj=PT.date.hijri;
    h+='<p style="margin:0">'+PT.date.readable+' · '+hj.day+' '+hj.month.en+' '+hj.year+' হিজরি</p>';
    var K=[["Fajr","ফজর","fajr"],["Dhuhr","যোহর","dhuhr"],["Asr","আসর","asr"],["Maghrib","মাগরিব","maghrib"],["Isha","এশা","isha"]];
    var nm=PSEL&&MS.find(function(x){return x.id===PSEL});
    h+=(nm?'<p style="margin:8px 0 0"><b>'+esc(nm.name)+'</b> — জামাতের সময়</p>':'<p class="mu" style="margin:8px 0 0;font-size:13px">মসজিদ বেছে নিলে তার জামাতের সময় দেখাবে।</p>');
    h+='<table class="tb"><tr><th>ওয়াক্ত</th><th>আজান</th><th>জামাত</th></tr>'+K.map(function(k){return'<tr><td>'+k[1]+'</td><td>'+PT.timings[k[0]].slice(0,5)+'</td><td>'+(TJ&&TJ[k[2]]?esc(TJ[k[2]]):"—")+'</td></tr>'}).join("")+'</table>';
    h+='<p class="mu" style="font-size:12px;margin:0">আজান সীতাকুণ্ড এলাকার হিসাবে। জামাতের সময় মসজিদ নিজে লিখেছে।</p>';
  }
  i.innerHTML=h+'</div>';
  var list=MS.filter(function(x){return !PSQ||x.name.indexOf(PSQ)>-1}).slice(0,12);
  c.innerHTML=list.length?'<div class="chips" style="margin-top:8px">'+list.map(function(x){return'<button class="'+(x.id===PSEL?"on":"")+'" onclick="pubPick(\''+x.id+'\')">'+esc(x.name)+'</button>'}).join("")+'</div>':'<p class="mu" style="margin:6px 0 0">এই নামে কোনো মসজিদ পাওয়া যায়নি।</p>';
}
function pubPick(id){PSEL=id;TJ=null;if(TJU)TJU();TJU=DB.doc("jt/"+id).onSnapshot(function(s){TJ=s.exists?s.data():{};updPub()},function(){});updPub()}
function authView(note){
  if(!PUBL){PUBL=true;loadPT();loadMS()}
  document.getElementById("app").innerHTML='<header><h2>এলাকার মসজিদ ব্যবস্থাপনা</h2></header><main>'+pubSkel()+LOGIN_HTML.replace("'+(note||\"\")+'",'')+'</main>';
  updPub();
}
function editJT(){
  var v2=TJM||{};
  return'<div class="fm"><b>আমাদের মসজিদের জামাতের সময়</b><p class="mu" style="font-size:13px;margin:0">এখানে লেখা সময় সবাই দেখবে।</p>'+[["jf","ফজর","fajr"],["jz","যোহর","dhuhr"],["ja","আসর","asr"],["jm","মাগরিব","maghrib"],["je","এশা","isha"]].map(function(x){return'<label>'+x[1]+'<input id="'+x[0]+'" value="'+esc(v2[x[2]]||"")+'" placeholder="যেমন ১:১৫ PM"></label>'}).join("")+'<button class="b" onclick="saveJT()">জামাতের সময় সংরক্ষণ করুন</button><p class="er">'+msg+'</p></div>';
}
function saveJT(){db.doc("jt/"+m).set({fajr:g("jf"),dhuhr:g("jz"),asr:g("ja"),maghrib:g("jm"),isha:g("je"),by:uid,ts:Date.now()}).then(function(){msg="জামাতের সময় সংরক্ষিত হয়েছে";render()}).catch(fail)}
function watchJM(){if(TJMU)TJMU();TJMU=db.doc("jt/"+m).onSnapshot(function(s){TJM=s.exists?s.data():{};render()},function(){})}
function go(t){tab=t;msg="";if(ANON&&m!==null)loadTot(m);if(t==="tm"){loadPT();if(canW&&m!==null)watchJM()}render()}
function sw(i){if(i==="")return;pick(i);if(tab==="tm"&&canW)watchJM();render()}

start();
</script>
</body>
